[package]
name = "zbobr"
version = "0.1.0"
edition = "2024"
default-run = "zbobr"
description = "AI-powered issue management automation using GitHub Copilot agents"
authors = ["milyin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/milyin/zbobr"
readme = "../README.md"
keywords = ["github", "automation", "copilot", "ai", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
zbobr-lib = { workspace = true }
zbobr-backend-github = { workspace = true }
octocrab = { workspace = true }
rmcp = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
rustls = { workspace = true }
