# zbobr sample configuration
# Copy this file to zbobr.toml and adjust values for your setup.

[dispatcher]
# Default AI model for agents.
# Options: gpt-4o, gpt-5-mini, claude-3-5-sonnet, claude-3-opus,
#          claude-sonnet-4.5, claude-haiku-4.5, claude-opus-4.6
# default_model = "gpt-5-mini"

# Directory where task work directories are created.
# workspace = "./workspace"

# CLI tool used by agents.
# Options: copilot, claude
# cli_tool = "copilot"

# Prefix for work branches created by the tool.
# work_branch_prefix = "zbobr_fix"

# GitHub token with read-only access, passed as GH_TOKEN to agent processes.
# agent_github_token = "ghp_..."

# GitHub token for Copilot CLI (passed as COPILOT_GITHUB_TOKEN).
# Falls back to GH_TOKEN / GITHUB_TOKEN env vars if not set.
# copilot_github_token = "ghp_..."

# Git identity for commits made by the tool.
# git_user_name = "zbobr-bot"
# git_user_email = "zbobr-bot@example.com"

[dispatcher.prompts]
# Base directory for resolving prompt file paths.
# path = "./prompts"

# Prompt files for each agent role.
# planner = ["prompts/planner.md", "prompts/common.md"]
# worker = ["prompts/worker.md", "prompts/common.md"]
# reviewer = ["prompts/reviewer.md", "prompts/common.md"]
# merger = ["prompts/merger.md", "prompts/common.md"]

[dispatcher.backend.github]
# GitHub repository used as the task tracker (issues + milestones).
# task_repo = "myorg/zbobr-tasks"

# GitHub user or organization where target repos are forked for implementation.
# fork_owner = "myorg-bots"

# GitHub token with read/write access to the tasks repo and fork org.
# Falls back to GH_TOKEN / GITHUB_TOKEN env vars if not set.
# github_token = "ghp_..."
