[dispatcher]
workspaces = "./workspaces"
git_user_name = "Copilot"
git_user_email = "copilot@example.com"
cli_tool = "copilot"
# Base directory for resolving relative prompt file paths
prompts_path = "./prompts"

# Example: override settings for individual stages
